media: media

content:
  - name: novels
    label: Novels
    type: collection
    path: novels
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Novel Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: cover
        label: Book Cover
        type: image

      - name: body
        label: Complete Story
        type: rich-text
              - name: status
        label: Publication Status
        type: select
        options:
          - label: Draft
            value: draft
          - label: Published
            value: published
        default: draft
