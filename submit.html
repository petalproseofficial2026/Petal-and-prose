
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Your Story | Petal & Prose</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Submit Your Story</h1>
<p>Share your creativity with Petal & Prose.</p>

<form action="https://formsubmit.co/sheezazahid4@gmail.com"
method="POST"
enctype="multipart/form-data">

<input type="text" name="name"
placeholder="Your Name" required>

<input type="email" name="email"
placeholder="Your Email" required>

<input type="text" name="title"
placeholder="Story Title" required>

<label>Upload Your Complete Story (PDF or Word)</label>

<input type="file"
name="attachment"
accept=".pdf,.doc,.docx"
required>

<input type="hidden" name="_subject"
value="New Story Submission - Petal & Prose">

<input type="hidden" name="_captcha" value="true">

<button type="submit">Submit Story</button>

</form>

<a href="index.html">Back to Home</a>

</body>
</html>
